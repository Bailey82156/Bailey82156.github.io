<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Victor Bailey - 82156-->>
   <link rel="preload" href="assets/videos/hero-still.jpg" as="image">
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hero Block with Video</title>

<meta name="description"
content="A hero block with a background video that plays in a continuous loop and includes a tinted overlay.">
  <link rel="preload" href="assets/img/business.jpg" as="image">
    <!-- Link to Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- Custom styles -->
    <style type="text/tailwindcss">
      header {
    @apply relative
           min-h-[60vh] md:min-h-[80vh]
           flex flex-col justify-center
           px-8 lg:px-60 py-12
           text-center
           overflow-hidden;
      }
    header video {
    @apply absolute inset-0
           w-full h-full
           object-cover;
}
header video {
    @apply absolute inset-0
           w-full h-full
           object-cover object-center;
}

header video {
    @apply object-center md:object-top;
}

header::before {
    content: "";
    @apply absolute inset-0
           bg-linear-to-b
           from-blue-950/70
           to-pink-900/30;
}

header h1,
header h2 {
    @apply relative z-10;
}
header::before {
    content: "";
    @apply absolute inset-0 bg-black/40;
}
header h1,
header h2 { @apply text-shadow-lg/30; }
    header {
    @apply min-h-[60vh] md:min-h-[80vh]
        bg-[url('assets/img/business.jpg')]
        bg-cover bg-center
        flex flex-col justify-center
        px-8 lg:px-60 py-12
        text-center;
}


        header h1 {
            @apply text-7xl md:text-8xl
            text-white font-bold
            tracking-tight
            mb-6
        }
        
    </style>

</head>


<body>
  <header>

    <video
        autoplay
        muted
        loop
        playsinline
        poster="assets/videos/hero-still.jpg">

        <source
            src="assets/videos/hero-video.mp4"
            type="video/mp4">
    </video>

    <h1>Education for Life</h1>

    <h2>A brighter career and future</h2>


        <h1 class= "slide-in-top "> Albert Camus</h1>

        <h2 class="slide-in-left"> Web Developer</h2>
  </header>
    <!-- /hero block -->

</body>
</html>
