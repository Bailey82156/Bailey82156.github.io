
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hero Block Generator</title>

    <meta name="description" content="Create and customise a responsive text hero block with editable headings and appearance settings.">

    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- SHARED HERO STYLES -->
    <style type="text/tailwindcss">

        .hero {
            @apply flex flex-col justify-center px-6 py-12 md:px-16;
        }

        .hero-content {
            @apply w-full max-w-5xl;
        }

        .hero-light {
            @apply bg-slate-50;
        }

        .hero-dark {
            @apply bg-slate-900;
        }

        .hero-centre {
            @apply text-center;
        }

        .hero-min-height {
            @apply min-h-[480px] md:min-h-[85vh];
        }

        .hero h1 {
            @apply mb-6 text-4xl font-bold tracking-tight text-slate-900 md:text-6xl break-words;
        }

        .hero h2 {
            @apply text-xl leading-relaxed text-slate-700 md:text-2xl break-words;
        }

        .hero-dark h1 {
            @apply text-slate-50;
        }

        .hero-dark h2 {
            @apply text-slate-300;
        }

        .hero-centre .hero-content {
            @apply mx-auto;
        }

        .hero h2[hidden] {
            display: none;
        }

        /* Heading font classes */

        .hero-h1-serif h1 {
            @apply font-serif;
        }

        .hero-h2-serif h2 {
            @apply font-serif;
        }

    </style>

    <!-- HEADING LETTER SPACING STYLES -->
    <style id="headingEffectsStyles">

        .hero h1 {
            letter-spacing: -0.05em;
        }

        .hero h2 {
            letter-spacing: -0.025em;
        }

    </style>

    <!-- EDITOR INTERFACE STYLES -->
    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #e2e8f0;
            color: #0f172a;
            padding-bottom: 90px;
        }

        .app-container {
            max-width: 1200px;
            margin: auto;
            padding: 24px;
        }

        .app-title {
            margin-bottom: 20px;
            font-size: 26px;
            font-weight: bold;
        }

        .control-panel {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 16px;
            padding: 18px;
            margin-bottom: 24px;
            background: white;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
        }

        .control-label {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
        }

        .control-label input {
            width: 17px;
            height: 17px;
            accent-color: #2563eb;
            cursor: pointer;
        }

        .control-label:focus-within,
        .effect-control:focus-within {
            outline: 2px solid #2563eb;
            outline-offset: 4px;
            border-radius: 3px;
        }

        .instruction {
            margin: 0 0 12px;
            color: #475569;
            font-size: 14px;
        }

        .effect-panel {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }

        .effect-group {
            padding: 18px;
            background: white;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
        }

        .effect-group h2 {
            margin: 0 0 16px;
            font-size: 17px;
        }

        .effect-control {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px;
            margin-bottom: 16px;
            font-size: 14px;
        }

        .effect-control:last-child {
            margin-bottom: 0;
        }

        .effect-control input[type="range"] {
            flex: 1;
            min-width: 120px;
            accent-color: #2563eb;
            cursor: pointer;
        }

        .effect-control output {
            min-width: 65px;
            font-family: monospace;
            font-weight: bold;
            text-align: right;
        }

        .effect-control:has(input:disabled) {
            opacity: 0.45;
            cursor: not-allowed;
        }

        .hero h1[contenteditable="true"],
        .hero h2[contenteditable="true"] {
            cursor: text;
        }

        .hero h1[contenteditable="true"]:focus,
        .hero h2[contenteditable="true"]:focus {
            outline: 3px dashed #3b82f6;
            outline-offset: 6px;
            border-radius: 3px;
        }

        .copy-button {
            position: fixed;
            right: 24px;
            bottom: 24px;
            z-index: 10;
            padding: 14px 22px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 12px #00000030;
        }

        .copy-button:hover {
            background: #1d4ed8;
        }

        .copy-button:focus-visible {
            outline: 3px solid #0f172a;
            outline-offset: 3px;
        }

        .status-message {
            margin-top: 14px;
            font-size: 14px;
            color: #166534;
        }

        .export-area {
            margin-top: 20px;
        }

        .export-area label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .export-area textarea {
            width: 100%;
            min-height: 240px;
            padding: 12px;
            box-sizing: border-box;
            font-family: monospace;
            font-size: 13px;
            border: 1px solid #94a3b8;
            border-radius: 6px;
        }

        @media (max-width: 600px) {

            .app-container {
                padding: 14px;
            }

            .control-panel {
                gap: 14px;
            }

            .copy-button {
                right: 14px;
                bottom: 14px;
            }

        }

    </style>

</head>

<body>

    <main class="app-container">

        <h1 class="app-title">Hero Block Generator</h1>

        <!-- MAIN SETTINGS -->
        <section class="control-panel" aria-label="Hero settings">

            <label class="control-label">
                <input type="checkbox" id="darkAppearance">
                Dark appearance
            </label>

            <label class="control-label">
                <input type="checkbox" id="centreText">
                Centre text
            </label>

            <label class="control-label">
                <input type="checkbox" id="minimumHeight" checked>
                Minimum height
            </label>

            <label class="control-label">
                <input type="checkbox" id="showSubheading" checked>
                Show subheading
            </label>

        </section>

        <!-- HEADING EFFECT CONTROLS -->
        <section class="effect-panel" aria-label="Heading effects">

            <!-- H1 EFFECTS -->
            <div class="effect-group">

                <h2>H1 Effects</h2>

                <label class="control-label effect-control">
                    <input type="checkbox" id="h1Serif">
                    Serif font
                </label>

                <label class="effect-control" for="h1Spacing">
                    Letter spacing

                    <input
                        type="range"
                        id="h1Spacing"
                        min="-0.05"
                        max="0.10"
                        step="0.005"
                        value="-0.05"
                    >

                    <output id="h1SpacingValue" for="h1Spacing">-0.050em</output>
                </label>

            </div>

            <!-- H2 EFFECTS -->
            <div class="effect-group">

                <h2>H2 Effects</h2>

                <label class="control-label effect-control">
                    <input type="checkbox" id="h2Serif">
                    Serif font
                </label>

                <label class="effect-control" for="h2Spacing">
                    Letter spacing

                    <input
                        type="range"
                        id="h2Spacing"
                        min="-0.05"
                        max="0.10"
                        step="0.005"
                        value="-0.025"
                    >

                    <output id="h2SpacingValue" for="h2Spacing">-0.025em</output>
                </label>

            </div>

        </section>

        <p class="instruction">
            Click a heading to edit the text.
        </p>

        <!-- HERO PREVIEW -->
        <header id="hero" class="hero hero-light hero-min-height">

            <div class="hero-content">

                <h1
                    id="heroHeading"
                    class="hero-heading"
                    contenteditable="plaintext-only"
                    aria-label="Edit main heading"
                    spellcheck="false"
                >Lorem ipsum dolor sit amet</h1>

                <h2
                    id="heroSubheading"
                    class="hero-subheading"
                    contenteditable="plaintext-only"
                    aria-label="Edit subheading"
                    spellcheck="false"
                >Consectetur adipiscing elit. Integer vitae libero ac risus egestas placerat.</h2>

            </div>

        </header>

        <!-- STATUS MESSAGE -->
        <p
            id="statusMessage"
            class="status-message"
            role="status"
            aria-live="polite"
        ></p>

        <!-- FALLBACK EXPORT AREA -->
        <div id="exportArea" class="export-area" hidden>

            <label for="exportCode">
                Copy the HTML below manually:
            </label>

            <textarea
                id="exportCode"
                readonly
                aria-label="Generated HTML code"
            ></textarea>

        </div>

    </main>

    <!-- COPY BUTTON -->
    <button id="copyButton" class="copy-button" type="button">
        Copy HTML
    </button>


    <script>

        // Get the HTML elements

        const hero = document.getElementById("hero");

        const heroHeading = document.getElementById("heroHeading");

        const heroSubheading = document.getElementById("heroSubheading");

        const darkAppearance = document.getElementById("darkAppearance");

        const centreText = document.getElementById("centreText");

        const minimumHeight = document.getElementById("minimumHeight");

        const showSubheading = document.getElementById("showSubheading");

        const h1Serif = document.getElementById("h1Serif");

        const h2Serif = document.getElementById("h2Serif");

        const h1Spacing = document.getElementById("h1Spacing");

        const h2Spacing = document.getElementById("h2Spacing");

        const h1SpacingValue = document.getElementById("h1SpacingValue");

        const h2SpacingValue = document.getElementById("h2SpacingValue");

        const h2EffectControls = document.querySelectorAll(
            "#h2Serif, #h2Spacing"
        );

        const headingEffectsStyles = document.getElementById(
            "headingEffectsStyles"
        );

        const copyButton = document.getElementById("copyButton");

        const statusMessage = document.getElementById("statusMessage");

        const exportArea = document.getElementById("exportArea");

        const exportCode = document.getElementById("exportCode");


        // Store all settings

        const settings = {

            dark: darkAppearance.checked,

            centre: centreText.checked,

            minHeight: minimumHeight.checked,

            showH2: showSubheading.checked,

            h1Serif: h1Serif.checked,

            h2Serif: h2Serif.checked,

            h1Spacing: Number(h1Spacing.value),

            h2Spacing: Number(h2Spacing.value)

        };


        // Update heading letter spacing CSS

        function updateHeadingSpacing() {

            headingEffectsStyles.textContent = `

                .hero h1 {
                    letter-spacing: ${settings.h1Spacing}em;
                }

                .hero h2 {
                    letter-spacing: ${settings.h2Spacing}em;
                }

            `;

            h1SpacingValue.textContent =
                settings.h1Spacing.toFixed(3) + "em";

            h2SpacingValue.textContent =
                settings.h2Spacing.toFixed(3) + "em";

        }


        // Enable or disable H2 effect controls

        function updateH2Controls() {

            h2Serif.disabled = !settings.showH2;

            h2Spacing.disabled = !settings.showH2;

        }


        // Update the hero appearance

        function updateHero() {

            settings.dark = darkAppearance.checked;

            settings.centre = centreText.checked;

            settings.minHeight = minimumHeight.checked;

            settings.showH2 = showSubheading.checked;

            settings.h1Serif = h1Serif.checked;

            settings.h2Serif = h2Serif.checked;

            // Update light and dark appearance

            hero.classList.toggle("hero-dark", settings.dark);

            hero.classList.toggle("hero-light", !settings.dark);

            // Update text alignment

            hero.classList.toggle("hero-centre", settings.centre);

            // Update minimum height

            hero.classList.toggle(
                "hero-min-height",
                settings.minHeight
            );

            // Update heading font classes

            hero.classList.toggle(
                "hero-h1-serif",
                settings.h1Serif
            );

            hero.classList.toggle(
                "hero-h2-serif",
                settings.h2Serif
            );

            // Show or hide the subheading

            heroSubheading.hidden = !settings.showH2;

            // Update H2 controls

            updateH2Controls();

            // Update exported HTML

            updateExportCode();

        }


        // Update H1 letter spacing

        function updateH1Spacing() {

            settings.h1Spacing = Number(h1Spacing.value);

            updateHeadingSpacing();

            updateExportCode();

        }


        // Update H2 letter spacing

        function updateH2Spacing() {

            settings.h2Spacing = Number(h2Spacing.value);

            updateHeadingSpacing();

            updateExportCode();

        }


        // Escape special HTML characters

        function escapeHTML(text) {

            return text.replace(/[&<>"']/g, function(character) {

                const characters = {

                    "&": "&amp;",
                    "<": "&lt;",
                    ">": "&gt;",
                    '"': "&quot;",
                    "'": "&#39;"

                };

                return characters[character];

            });

        }


        // Generate a complete standalone HTML document

        function generateHTML() {

            const headingText = escapeHTML(heroHeading.textContent);

            const subheadingText = escapeHTML(heroSubheading.textContent);

            // Build hero classes

            const heroClasses = [

                "hero",

                settings.dark ? "hero-dark" : "hero-light",

                settings.centre ? "hero-centre" : "",

                settings.minHeight ? "hero-min-height" : "",

                settings.h1Serif ? "hero-h1-serif" : "",

                settings.h2Serif ? "hero-h2-serif" : ""

            ].filter(Boolean).join(" ");


            // Include H2 only when selected

            const subheadingHTML = settings.showH2

                ? `<h2 class="hero-subheading">${subheadingText}</h2>`

                : "";


            // Generate heading-specific spacing rules

            const exportedSpacingCSS = `

        .hero h1 {
            letter-spacing: ${settings.h1Spacing}em;
        }

        .hero h2 {
            letter-spacing: ${settings.h2Spacing}em;
        }

            `;


            // Return complete HTML document

            return `<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Hero Block</title>

    <meta name="description" content="Short, unique description of web page. Often used as the snippet shown in search results. About 120 characters is ideal.">

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"><\/script>

    <style type="text/tailwindcss">

        .hero {
            @apply flex flex-col justify-center px-6 py-12 md:px-16;
        }

        .hero-content {
            @apply w-full max-w-5xl;
        }

        .hero-light {
            @apply bg-slate-50;
        }

        .hero-dark {
            @apply bg-slate-900;
        }

        .hero-centre {
            @apply text-center;
        }

        .hero-min-height {
            @apply min-h-[480px] md:min-h-[85vh];
        }

        .hero h1 {
            @apply mb-6 text-4xl font-bold tracking-tight text-slate-900 md:text-6xl break-words;
        }

        .hero h2 {
            @apply text-xl leading-relaxed text-slate-700 md:text-2xl break-words;
        }

        .hero-dark h1 {
            @apply text-slate-50;
        }

        .hero-dark h2 {
            @apply text-slate-300;
        }

        .hero-centre .hero-content {
            @apply mx-auto;
        }

        .hero h2[hidden] {
            display: none;
        }

        .hero-h1-serif h1 {
            @apply font-serif;
        }

        .hero-h2-serif h2 {
            @apply font-serif;
        }

    </style>

    <style>

        ${exportedSpacingCSS}

    </style>

</head>

<body>

    <header class="${heroClasses}">

        <div class="hero-content">

            <h1 class="hero-heading">${headingText}</h1>

            ${subheadingHTML}

        </div>

    </header>

</body>
</html>`;

        }


        // Update fallback export textarea

        function updateExportCode() {

            exportCode.value = generateHTML();

        }


        // Copy generated HTML

        async function copyHTML() {

            const generatedHTML = generateHTML();

            try {

                if (!navigator.clipboard || !window.isSecureContext) {

                    throw new Error("Clipboard unavailable");

                }

                await navigator.clipboard.writeText(generatedHTML);

                statusMessage.textContent =
                    "HTML copied—paste it into VS Code.";

                exportArea.hidden = true;

            } catch (error) {

                // Manual copying fallback

                exportCode.value = generatedHTML;

                exportArea.hidden = false;

                statusMessage.textContent =
                    "Automatic copying is unavailable. Copy the HTML from the text area below.";

                exportCode.focus();

                exportCode.select();

            }

        }


        // Listen for checkbox changes

        darkAppearance.addEventListener("change", updateHero);

        centreText.addEventListener("change", updateHero);

        minimumHeight.addEventListener("change", updateHero);

        showSubheading.addEventListener("change", updateHero);

        h1Serif.addEventListener("change", updateHero);

        h2Serif.addEventListener("change", updateHero);


        // Listen for slider changes

        h1Spacing.addEventListener("input", updateH1Spacing);

        h2Spacing.addEventListener("input", updateH2Spacing);


        // Update export when headings are edited

        heroHeading.addEventListener("input", updateExportCode);

        heroSubheading.addEventListener("input", updateExportCode);


        // Copy button

        copyButton.addEventListener("click", copyHTML);


        // Set initial values and appearance

        updateHeadingSpacing();

        updateHero();

    </script>

</body>
</html>
